name: Weather delivery offline checks

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/agents/workshop-coach.agent.md"
      - ".github/copilot-instructions.md"
      - "workshop/weather_delivery/**"
      - "workshop/weather-delivery/**"
      - "workshop/01-prompt-agents.md"
      - "workshop/COACH.md"
      - "workshop/README.md"
      - "workshop/TESTS.md"
      - "workshop/FACILITATOR.md"
      - "workshop/templates/progress.json"
      - ".github/workflows/weather-delivery-check.yml"
      - ".github/workflows/weather-delivery-cloud.yml"
      - ".github/workflows/weather-delivery-deploy.yml"
      - "student/weather-delivery/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/agents/workshop-coach.agent.md"
      - ".github/copilot-instructions.md"
      - "workshop/weather_delivery/**"
      - "workshop/weather-delivery/**"
      - "workshop/01-prompt-agents.md"
      - "workshop/COACH.md"
      - "workshop/README.md"
      - "workshop/TESTS.md"
      - "workshop/FACILITATOR.md"
      - "workshop/templates/progress.json"
      - ".github/workflows/weather-delivery-check.yml"
      - ".github/workflows/weather-delivery-cloud.yml"
      - ".github/workflows/weather-delivery-deploy.yml"
      - "student/weather-delivery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Validate delivery workflow structure
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= \
            .github/workflows/weather-delivery-check.yml \
            .github/workflows/weather-delivery-cloud.yml \
            .github/workflows/weather-delivery-deploy.yml
      - name: Run offline contract and progress-state tests
        id: tests
        run: python -S -m unittest discover -s workshop/weather_delivery -p "test_*.py" -v
      - name: Report exactly what was checked
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python -S -m workshop.weather_delivery.offline_ci \
            --commit "$GITHUB_SHA" \
            --manifest student/weather-delivery/manifest.json \
            --tests-outcome "$TESTS_OUTCOME" \
            --output-dir artifacts/weather-delivery \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve offline coverage and hash record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/weather-delivery/**
          retention-days: 14
