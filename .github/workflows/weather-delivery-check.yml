name: Weather delivery offline checks

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/agents/workshop-coach.agent.md"
      - ".github/copilot-instructions.md"
      - "workshop/weather_delivery/**"
      - "workshop/weather-delivery/**"
      - "workshop/01-prompt-agents.md"
      - "workshop/COACH.md"
      - "workshop/README.md"
      - "workshop/TESTS.md"
      - "workshop/FACILITATOR.md"
      - "workshop/START.md"
      - "workshop/PREREQUISITES.md"
      - "workshop/templates/progress.json"
      - ".github/workflows/**"
      - "student/weather-delivery/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/agents/workshop-coach.agent.md"
      - ".github/copilot-instructions.md"
      - "workshop/weather_delivery/**"
      - "workshop/weather-delivery/**"
      - "workshop/01-prompt-agents.md"
      - "workshop/COACH.md"
      - "workshop/README.md"
      - "workshop/TESTS.md"
      - "workshop/FACILITATOR.md"
      - "workshop/START.md"
      - "workshop/PREREQUISITES.md"
      - "workshop/templates/progress.json"
      - ".github/workflows/**"
      - "student/weather-delivery/**"

permissions:
  contents: read

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow structure, expressions and context availability
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color -shellcheck= .github/workflows/*.yml
  offline-contract-tests:
    name: Delivery-code tests and optional participant-package checks (offline only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic delivery-code tests (not live agent tests)
        id: delivery-tests
        run: python -S -m unittest discover -s workshop/weather_delivery -p "test_*.py" -v
      - name: Report exactly what offline CI checked
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.delivery-tests.outcome }}
        run: |
          python -S -m workshop.weather_delivery.offline_ci \
            --commit "$GITHUB_SHA" \
            --tests-outcome "$TEST_OUTCOME" \
            --manifest student/weather-delivery/manifest.json \
            --output-dir artifacts/weather-delivery-offline \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve offline coverage report and available hash record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/weather-delivery-offline/
          if-no-files-found: error
          retention-days: 14
