name: Capture Weather Dev configuration

on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: Exact saved version of the configured Weather Dev agent
        type: string
        required: true

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: weather-delivery-capture
  cancel-in-progress: false

jobs:
  capture-and-open-pr:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CONFIG_DIR: ${{ runner.temp }}/weather-delivery-azure-cli
      AZURE_CLIENT_ID: ${{ vars.WEATHER_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.WEATHER_AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.WEATHER_AZURE_SUBSCRIPTION_ID }}
      EXPECTED_OIDC_SUBJECT: ${{ vars.WEATHER_CAPTURE_OIDC_SUBJECT }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.WEATHER_FOUNDRY_PROJECT_ENDPOINT }}
      WEATHER_DEV_AGENT_NAME: ${{ vars.WEATHER_DEV_AGENT_NAME }}
      WEATHER_PROD_AGENT_NAME: ${{ vars.WEATHER_PROD_AGENT_NAME }}
      WEATHER_PROD_STABLE_ENDPOINT: ${{ vars.WEATHER_PROD_STABLE_ENDPOINT }}
      AGENT_VERSION: ${{ inputs.agent_version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CAPTURE_BRANCH: weather-capture/${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check lab configuration before signing in
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import os
          required = (
              "AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
              "EXPECTED_OIDC_SUBJECT", "FOUNDRY_PROJECT_ENDPOINT",
              "WEATHER_DEV_AGENT_NAME", "WEATHER_PROD_AGENT_NAME",
              "WEATHER_PROD_STABLE_ENDPOINT",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          for name in missing:
              print(f"::error::Missing lab setting: {name}. Ask the facilitator to complete setup; no Azure operation has run.")
          raise SystemExit(bool(missing))
          PY
          if [[ "$WEATHER_DEV_AGENT_NAME" == "$WEATHER_PROD_AGENT_NAME" ]]; then
            echo "::error::Dev and Prod must be different existing agents."
            exit 1
          fi
      - name: Verify the exact GitHub OIDC subject before Azure login
        run: python -S -m workshop.weather_delivery.cloud_stages verify-oidc
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.WEATHER_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.WEATHER_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.WEATHER_AZURE_SUBSCRIPTION_ID }}
      - name: Capture the saved Dev version and prepare the reviewed PR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEATHER_DEV_AGENT_NAME"
          test -n "$WEATHER_PROD_AGENT_NAME"
          test -n "$WEATHER_PROD_STABLE_ENDPOINT"
          mkdir -p student/weather-delivery artifacts/weather-delivery
          python -S -m workshop.weather_delivery.cloud_stages capture \
            --agent-name "$WEATHER_DEV_AGENT_NAME" \
            --version "$AGENT_VERSION" \
            --output student/weather-delivery/agent-definition.json \
            --record artifacts/weather-delivery/capture.json
          python -S -m workshop.weather_delivery.cloud_stages package-capture \
            --agent-name "$WEATHER_DEV_AGENT_NAME" \
            --version "$AGENT_VERSION" \
            --production-agent "$WEATHER_PROD_AGENT_NAME" \
            --production-stable-endpoint "$WEATHER_PROD_STABLE_ENDPOINT" \
            --project-endpoint "$FOUNDRY_PROJECT_ENDPOINT" \
            --definition student/weather-delivery/agent-definition.json \
            --output student/weather-delivery/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          capture_description='Add your Weather agent configuration to Git for the first time.'
          if git ls-files --error-unmatch student/weather-delivery/agent-definition.json >/dev/null 2>&1; then
            capture_description='Review changes since the previous captured Weather configuration.'
          fi
          git switch --create "$CAPTURE_BRANCH"
          git add student/weather-delivery/agent-definition.json student/weather-delivery/manifest.json
          if git diff --cached --quiet; then
            echo "The captured Dev version matches the configuration already in Git; no PR is needed."
            printf '%s\n' '## Nothing new to promote' \
              'The selected Dev version already matches the tracked package. No PR was opened and Prod was not changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Capture Weather Dev version $AGENT_VERSION"
          git push --set-upstream origin "$CAPTURE_BRANCH"
          body="$(printf '%s\n' \
            '## Captured configuration' \
            '' \
            "$capture_description" \
            '' \
            "- Dev agent: \`$WEATHER_DEV_AGENT_NAME\`" \
            "- Dev version: \`$AGENT_VERSION\`" \
            "- Intended Prod agent: \`$WEATHER_PROD_AGENT_NAME\`" \
            '' \
            '## Your next steps' \
            '- Open **Files changed**. Find the instructions you recognize from Microsoft Foundry, then inspect the model and tool references.' \
            '- Open **Checks** and wait for `offline-contract-tests`. These checks validate package consistency, not live model or tool behavior.' \
            '- Confirm the Dev version and Prod target above, then merge if this is the configuration you intend to promote.' \
            '- Merging authorizes the reviewed configuration to enter the delivery branch; the separate `production` environment gate controls deployment.' \
            '' \
            'The capture contains agent configuration only. It does not contain credentials, Conversations, transcripts, or memory contents.')"
          pr_url="$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$CAPTURE_BRANCH" \
            --title "Promote Weather Dev configuration to Prod" \
            --body "$body")"
          {
            printf '## Captured: ready for your review\n\n'
            printf '%s\n\n' "$capture_description"
            printf 'Dev: `%s`, saved version `%s` → intended Prod: `%s`.\n\n' "$WEATHER_DEV_AGENT_NAME" "$AGENT_VERSION" "$WEATHER_PROD_AGENT_NAME"
            printf '[Open your pull request](%s)\n\n' "$pr_url"
            printf '%s\n' 'Next: inspect **Files changed**, wait for the offline check, then review and merge. Dev and Prod have not been changed by capture.'
          } >> "$GITHUB_STEP_SUMMARY"
          gh workflow run weather-delivery-check.yml --ref "$CAPTURE_BRANCH"
      - name: Explain an incomplete capture
        if: failure()
        run: |
          printf '%s\n' '## Capture did not complete' \
            'Open the first failed step above. A PR may already exist if check dispatch failed; inspect it before rerunning.' \
            'Do not paste tokens or credentials into the Coach conversation. Capture does not deploy to Prod.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve capture metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/weather-delivery/**
          if-no-files-found: warn
          retention-days: 14
